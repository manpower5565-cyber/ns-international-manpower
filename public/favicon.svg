  <rect width="100" height="100" rx="20" fill="#102B4E" />
  <!-- Subtle Globe Meridians -->
  <circle cx="50" cy="50" r="38" stroke="#E7AD43" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="3 3"/>
  <ellipse cx="50" cy="50" rx="22" ry="38" stroke="#E7AD43" stroke-width="2" stroke-opacity="0.25"/>
  <line x1="12" y1="50" x2="88" y2="50" stroke="#E7AD43" stroke-width="2" stroke-opacity="0.25"/>
